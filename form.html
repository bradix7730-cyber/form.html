<!DOCTYPE html>
<html> lang ="en"
<head>
    <title>Registration Form</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form>

    <label>Full Name:</label>
    <input type="text" name="fullname">
    <br><br>

    <label>Year Level:</label><br>
    <input type="radio" name="year" value="1st Year"> 1st Year
    <input type="radio" name="year" value="2nd Year"> 2nd Year
    <input type="radio" name="year" value="3rd Year"> 3rd Year
    <input type="radio" name="year" value="4th Year"> 4th Year

    <br><br>

    <label>Course:</label>
    <select name="course">
        <option>-- Select Course --</option>
        <option>DAAIT</option>
        <option>BSIT</option>
        <option>BSCS</option>
    
    </select>

    <br><br>

    <label>Comments:</label><br>
    <textarea name="comments" rows="5" cols="40"
        placeholder="Enter your comments here..."></textarea>

    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
